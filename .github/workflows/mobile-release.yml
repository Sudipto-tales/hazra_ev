# ──────────────────────────────────────────────────────────────────────────────
# Mobile Release Build
#
# Triggered when a tag matching `mobile-v*` is pushed.
# Builds a release APK, uploads it to the Hostinger deploy API as a draft,
# and creates a GitHub Release as backup.
#
# Required GitHub Secrets:
#   DEPLOY_API_KEY           — matches DEPLOY_API_KEY in Hostinger .env
#   DEPLOY_API_URL           — e.g. https://hazraelectricalbike.com/api/v1/deploy/app-releases
#   ANDROID_KEYSTORE_BASE64  — base64-encoded release keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   API_BASE_URL_PROD        — e.g. https://hazraelectricalbike.com/api/v1
# ──────────────────────────────────────────────────────────────────────────────

name: Mobile Release Build

on:
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ───────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Parse version from tag ─────────────────────────────
      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${TAG#mobile-v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      # ── Read version_code from pubspec.yaml ────────────────
      - name: Read version_code from pubspec.yaml
        id: pubspec
        run: |
          VERSION_LINE=$(grep '^version:' mobile_app/pubspec.yaml)
          VERSION_CODE=$(echo "$VERSION_LINE" | sed 's/.*+//')
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      # ── Setup Java ─────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── Setup Flutter ──────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable
          cache: true

      # ── Dependencies ───────────────────────────────────────
      - name: Flutter pub get
        working-directory: mobile_app
        run: flutter pub get

      # ── Signing setup ──────────────────────────────────────
      - name: Decode Android keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > mobile_app/android/app/release.keystore

      - name: Create key.properties
        run: |
          cat > mobile_app/android/key.properties << EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # ── Build ───────────────────────────────────────────────
      - name: Build release APK
        working-directory: mobile_app
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL_PROD }}

      # ── Checksum ────────────────────────────────────────────
      - name: Compute SHA-256
        id: checksum
        run: |
          APK_PATH="mobile_app/build/app/outputs/flutter-apk/app-release.apk"
          SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
          SIZE=$(stat --printf="%s" "$APK_PATH")
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "file_size=$SIZE" >> $GITHUB_OUTPUT
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      # ── Upload to Hostinger ─────────────────────────────────
      - name: Upload to Hostinger deploy API
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/deploy-response.json -w '%{http_code}' \
            -X POST "${{ secrets.DEPLOY_API_URL }}" \
            -H "X-Deploy-Key: ${{ secrets.DEPLOY_API_KEY }}" \
            -F "file=@${{ steps.checksum.outputs.apk_path }}" \
            -F "platform=android" \
            -F "version_name=${{ steps.version.outputs.version_name }}" \
            -F "version_code=${{ steps.pubspec.outputs.version_code }}" \
            -F "git_tag=${{ steps.version.outputs.tag }}" \
            -F "git_sha=${{ github.sha }}" \
            -F "checksum_sha256=${{ steps.checksum.outputs.sha256 }}" \
            -F "release_notes=Automated build from tag ${{ steps.version.outputs.tag }}")

          echo "Deploy API response (HTTP $HTTP_STATUS):"
          cat /tmp/deploy-response.json

          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::error::Deploy API returned HTTP $HTTP_STATUS"
            exit 1
          fi

      # ── Backup artifacts ────────────────────────────────────
      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.version_name }}
          path: ${{ steps.checksum.outputs.apk_path }}
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Mobile v${{ steps.version.outputs.version_name }}"
          body: |
            **Automated build from tag `${{ steps.version.outputs.tag }}`**

            - Version: `${{ steps.version.outputs.version_name }}+${{ steps.pubspec.outputs.version_code }}`
            - SHA-256: `${{ steps.checksum.outputs.sha256 }}`
            - Commit: `${{ github.sha }}`

            > This APK was uploaded to the deploy API as a **draft**. Publish it via the Admin panel.
          files: ${{ steps.checksum.outputs.apk_path }}
          draft: false
          prerelease: false

      # ── Cleanup ─────────────────────────────────────────────
      - name: Cleanup keystore
        if: always()
        run: rm -f mobile_app/android/app/release.keystore mobile_app/android/key.properties
