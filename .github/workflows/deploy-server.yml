name: Deploy Website to Hostinger

on:
  push:
    branches: [deploy]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 65002 }}
          script_stop: true
          envs: PROD_ENV_FILE
          script: |
            set -e
            TARGET_DIR="${{ secrets.SSH_TARGET_DIR || 'domains/hazraelectricalbike.com/public_html' }}"

            # If TARGET_DIR is accidentally set to bare 'public_html', auto-correct to domain path
            if [ "$TARGET_DIR" = "public_html" ] && [ -d ~/domains/hazraelectricalbike.com/public_html ]; then
              TARGET_DIR="domains/hazraelectricalbike.com/public_html"
            fi

            echo "==> Target directory: ~/$TARGET_DIR"
            mkdir -p ~/"$TARGET_DIR"
            cd ~/"$TARGET_DIR"

            # Clean up misplaced clone in ~/public_html if present
            if [ "$TARGET_DIR" != "public_html" ] && [ -f ~/public_html/index.php ] && [ -d ~/public_html/.git ]; then
              echo "==> Cleaning up misplaced git repo in ~/public_html..."
              rm -rf ~/public_html/* ~/public_html/.[!.]* 2>/dev/null || true
            fi

            # Force fresh clone if website files missing or sparse-checkout enabled
            if [ ! -f index.php ] || git config core.sparseCheckout 2>/dev/null | grep -q true; then
              echo "==> Initializing fresh git repo in ~/$TARGET_DIR..."
              rm -rf ~/"$TARGET_DIR"
              mkdir -p ~/"$TARGET_DIR"
              cd ~/"$TARGET_DIR"
              git init
              git remote add origin https://github.com/Sudipto-tales/hazra_ev.git
            fi

            echo "==> Fetching website branch..."
            git fetch origin website
            git reset --hard origin/website

            if [ -n "$PROD_ENV_FILE" ]; then
              echo "$PROD_ENV_FILE" > .env
              chmod 600 .env
            fi

            if [ -f composer.json ]; then
              composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --quiet
            fi

            if [ -f vayu ]; then
              php vayu db:sync || true
            fi

            mkdir -p storage/apk storage/uploads storage/logs database
            chmod -R 775 storage 2>/dev/null || true

            echo "==> Done. Current commit:"
            git log -1 --oneline
            ls -la
            
            echo "==> PHP version check:"
            php -v
            
            echo "==> Testing PHP execution:"
            php -r "echo 'PHP works\n';"
            
            echo "==> Checking required extensions:"
            php -m | grep -E "pdo_mysql|mbstring|json|curl|xml"