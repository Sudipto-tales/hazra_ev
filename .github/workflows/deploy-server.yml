name: Deploy Website to Hostinger

on:
  push:
    branches: [deploy]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 65002 }}
          script_stop: true
          envs: PROD_ENV_FILE
          script: |
            set -e
            TARGET_DIR="${{ secrets.SSH_TARGET_DIR || 'public_html' }}"
            echo "==> Deploying into: $TARGET_DIR"
            cd ~/"$TARGET_DIR" || { echo "ERROR: $TARGET_DIR not found"; exit 1; }

            if [ ! -d .git ]; then
              echo "==> Not a git repo. Initializing..."
              git init
              git remote add origin https://github.com/Sudipto-tales/hazra_ev.git
            fi

            # Disable sparse-checkout if previously enabled
            git config core.sparseCheckout false 2>/dev/null || true
            rm -f .git/info/sparse-checkout

            echo "==> Fetching website branch..."
            git fetch origin website
            git reset --hard origin/website

            if [ -n "$PROD_ENV_FILE" ]; then
              echo "$PROD_ENV_FILE" > .env
              chmod 600 .env
            fi

            if [ -f composer.json ]; then
              composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --quiet
            fi

            if [ -f vayu ]; then
              php vayu db:sync || true
            fi

            mkdir -p storage/apk storage/uploads storage/logs database
            chmod -R 775 storage 2>/dev/null || true

            echo "==> Done. Current commit:"
            git log -1 --oneline
            ls -la