<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
/* Applied before first paint so a dark-mode visitor never sees a light
   flash. Kept inline and tiny on purpose: an external file would race
   the paint it exists to prevent. */
(function(){try{var t=localStorage.getItem('theme')||localStorage.getItem('vm-theme');
if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
  <title>Dealership Enquiry | Hazra</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hazra Electrical Bike">
<meta property="og:title" content="Dealership Enquiry | Hazra">
<meta property="og:description" content="Interested in partnering with Hazra Electrical Bike? Submit your dealership enquiry.">
<meta property="og:url" content="https://hazraelectricalbike.com/dealership-enquiry.html">
<meta property="og:image" content="https://hazraelectricalbike.com/assets/scutie_light.webp">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://hazraelectricalbike.com/dealership-enquiry.html">
<meta name="description" content="Interested in partnering with Hazra Electrical Bike? Submit your dealership enquiry.">
  <link rel="icon" href="assets/hazraev.png" type="image/png">
<link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/typography.css">
<link rel="stylesheet" href="styles/global.css">
<link rel="stylesheet" href="styles/utilities.css">
<link rel="stylesheet" href="styles/components/page-chrome.css">
  <style>

    .form-section {
      padding: clamp(60px, 9vw, 140px) 26px;
      background: rgb(var(--chip-rgb) / .35);
      border-top: 1px solid var(--hair-0);
    }

    .form-section__in { width: min(700px, 93vw); margin: 0 auto; }

    .form {
      background: var(--surface-0);
      padding: clamp(40px, 5vw, 60px);
      border-radius: 20px;
      border: 1px solid var(--hair-0);
      opacity: 0; transform: translateY(30px);
      animation: reveal-up .8s var(--ease) .2s forwards;
    }

    .fields {
      display: flex; flex-direction: column;
      gap: 20px;
    }

    .field {
      display: flex; flex-direction: column; gap: 8px;
    }

    .field label {
      font-size: 12px; font-weight: 700;
      letter-spacing: .06em;
      color: var(--ink-soft-0);
    }

    .field input,
    .field select,
    .field textarea {
      padding: 12px 16px;
      background: rgb(var(--chip-rgb) / .35);
      border: 1px solid var(--hair-0);
      border-radius: 8px;
      font-family: 'Inter';
      color: var(--ink-0);
      font-size: 14px;
      transition: border-color .35s var(--ease);
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--brand-violet);
    }

    .field textarea {
      resize: vertical; min-height: 120px;
    }

    .form__group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form__submit {
      padding: 14px 26px;
      background: var(--brand-grad);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 12px; font-weight: 700;
      cursor: pointer;
      transition: all .35s var(--ease);
      width: 100%;
      letter-spacing: .06em;
    }

    .form__submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px -12px rgba(240, 83, 43, .55);
    }

    .success {
      text-align: center;
      padding: 40px;
      background: rgb(123, 47, 247, .1);
      border-radius: 16px;
      border: 1px solid var(--brand-violet);
      margin-top: 20px;
      opacity: 0;
    }

    .success.show {
      animation: pop .7s cubic-bezier(.18,.9,.32,1.28) forwards;
    }

    .success__icon {
      font-size: 48px; margin-bottom: 16px;
    }

    .success__title {
      font-family: 'Montserrat'; font-weight: 800;
      margin-bottom: 8px;
    }

    .success__desc {
      font-size: 13px; color: var(--ink-soft-0);
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(.95); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 768px) {
      .form__group { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition-duration: .01ms !important; }
    }</style>
</head>
<body>

<header class="header">
  <div class="header__top">
    <a class="brand" href="index.html">
      <img class="brand__mark" src="assets/hazraev.png" alt="Hazra">
      <span class="brand__txt">Hazra Electrical Bike</span>
    </a>
    <button class="theme" id="theme" aria-label="Toggle theme">
      <i data-lucide="sun-medium" class="theme__sun"></i>
      <i data-lucide="moon" class="theme__moon"></i>
    </button>
  </div>
</header>

<section class="hero">
  <h1 class="hero__title">Dealership Enquiry</h1>
  <p class="hero__lead">
    Interested in partnering with Hazra? Submit your enquiry and let's talk.
  </p>
</section>

<section class="form-section">
  <div class="form-section__in">
    <form class="form" id="enquiryForm" onsubmit="handleSubmit(event)">
      <div class="fields">
        <div class="form__group">
          <div class="field">
            <label>Business Name *</label>
            <input type="text" name="business" placeholder="Your business name" required>
          </div>
          <div class="field">
            <label>Contact Person *</label>
            <input type="text" name="contact" placeholder="Full name" required>
          </div>
        </div>

        <div class="form__group">
          <div class="field">
            <label>City *</label>
            <input type="text" name="city" placeholder="City" required>
          </div>
          <div class="field">
            <label>State *</label>
            <input type="text" name="state" placeholder="State" required>
          </div>
        </div>

        <div class="form__group">
          <div class="field">
            <label>Phone Number *</label>
            <input type="tel" name="phone" placeholder="+91 XXXXX XXXXX" required>
          </div>
          <div class="field">
            <label>Email *</label>
            <input type="email" name="email" placeholder="your@email.com" required>
          </div>
        </div>

        <div class="form__group">
          <div class="field">
            <label>Years of Experience *</label>
            <input type="number" name="experience" placeholder="5" required>
          </div>
          <div class="field">
            <label>Business Type *</label>
            <select name="type" required>
              <option value="">Select type</option>
              <option value="retail">Retail Store</option>
              <option value="service">Service Center</option>
              <option value="both">Both</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>About Your Business Proposal</label>
          <textarea name="proposal" placeholder="Tell us about your business plan, current operations, and why you want to partner with Hazra"></textarea>
        </div>

        <button type="submit" class="form__submit">
          Submit Enquiry
        </button>

        <div class="success" id="successMsg">
          <div class="success__icon">✓</div>
          <div class="success__title">Thank You!</div>
          <div class="success__desc">Your enquiry has been received. Our team will contact you within 24 hours.</div>
        </div>
      </div>
    </form>
  </div>
</section>

<section class="footer">
  <p style="color: var(--ink-soft-0); margin-bottom: 24px;">
    For immediate assistance, call us at +91 98290 16542
  </p>
  <a class="footer__link" href="index.html">
    <span>Back to home</span>
    <i data-lucide="arrow-right"></i>
  </a>
</section>

<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<script>
  lucide.createIcons();

  const themeBtn = document.getElementById('theme');
  themeBtn.addEventListener('click', () => {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    localStorage.setItem('theme', isDark ? 'light' : 'dark');
  });

  const savedTheme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);

  function handleSubmit(e) {
    e.preventDefault();
    const successMsg = document.getElementById('successMsg');
    successMsg.classList.add('show');
    e.target.reset();
    setTimeout(() => {
      successMsg.classList.remove('show');
    }, 3000);
  }
</script>

</body>
</html>
