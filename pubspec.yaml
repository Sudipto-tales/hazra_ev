name: employeetracking_mobile_app
description: Salesman / Employee tracking mobile app — UI layer with static data.
publish_to: "none"
version: 0.1.10+11

# Requires Flutter 3.27+ (uses Color.withValues and TextScaler.clamp).
environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # API client. `http` is enough for this surface — every call is a plain
  # JSON request/response against website/api, and the one streaming endpoint
  # (SSE /stream) is an admin-web concern, not a mobile one.
  http: ^1.5.0

  # Survives the access/refresh token pair across app restarts so the field
  # team is not asked to sign in every launch.
  shared_preferences: ^2.3.0

  # OpenStreetMap basemap for the admin route screen. Pure Dart/Flutter — it
  # renders raster tiles itself rather than embedding a platform map view, so
  # there is no Google/Mapbox key and no per-platform native setup.
  # The hand-painted RoutePainter stays as the offline fallback.
  flutter_map: ^8.3.1

  # Real device location. Wraps the platform location APIs and owns the
  # permission prompts, so no separate permission plugin is needed.
  geolocator: ^13.0.2

  # Camera / gallery picker for report attachments. The bytes go up as
  # multipart to POST /reports/{id}/images.
  image_picker: ^1.1.2
  url_launcher: ^6.3.2

  # LatLng type flutter_map speaks. The app's own models stay plain doubles;
  # conversion happens at the map boundary only.
  latlong2: ^0.10.1

  # Reads the real app version + build number at runtime so the value shown in
  # Settings, on the login screens and in the login device payload always
  # matches pubspec `version:` without a hand-maintained constant.
  package_info_plus: ^10.2.2
  flutter_foreground_task: ^11.0.3

  # Vector animation player, for the one place the app ships an animation it
  # did not draw itself: the rider on the Version easter-egg screen. Pure
  # Dart, no native side, and it renders the one 40 KB asset we bundle.
  # The 3.3.1 floor is deliberate: it is the last release that still builds
  # on the Flutter 3.27 named above, so the declared floor stays true. Newer
  # 3.x needs a newer Flutter and the lockfile takes it when one is present.
  lottie: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Bundled art. Everything else on screen is either painted at runtime or
  # fetched from the API.
  #
  # hazra_logo.png is the launch screen's mark. It is derived from
  # `website/assets/hazraevLogo.jpg` (design-agent's file, not ours to edit):
  # the white JPEG field was keyed out to alpha and the result resampled up to
  # 480px so it is not pixellated at the 128dp it draws at. A byte-identical
  # copy lives at `android/.../res/drawable-nodpi/hazra_splash_logo.png` for
  # the native launch background — the two must stay the same image or the
  # native→Flutter handoff visibly jumps.
  assets:
    - assets/anim/delivery_boy.json
    - assets/brand/hazra_logo.png
