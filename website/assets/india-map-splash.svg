  <g fill="#fff" stroke="#7b2ff7" stroke-width="4">
    <circle cx="210" cy="110" r="7"/><circle cx="175" cy="155" r="6"/><circle cx="240" cy="165" r="6"/>
    <circle cx="155" cy="210" r="7"/><circle cx="200" cy="230" r="6"/><circle cx="255" cy="250" r="5"/>
    <circle cx="180" cy="290" r="6"/><circle cx="220" cy="320" r="5"/><circle cx="195" cy="360" r="6"/><circle cx="165" cy="250" r="5"/>
