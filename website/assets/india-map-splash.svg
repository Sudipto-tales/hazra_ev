<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" role="img" aria-labelledby="title desc">
  <title id="title">Hazra Electrical Bike network across India</title>
  <desc id="desc">A glowing indigo and violet map silhouette of India with network points.</desc>
  <defs>
    <linearGradient id="map" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b52cff"/>
      <stop offset=".52" stop-color="#644bff"/>
      <stop offset="1" stop-color="#13a9df"/>
    </linearGradient>
    <radialGradient id="wash">
      <stop offset="0" stop-color="#a52cff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#a52cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="210" cy="230" r="190" fill="url(#wash)"/>
